<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Émulateur Dermaly</title>
<style>
  :root { --bg: #1e1f24; --ink: #e9e9ee; --muted: #9a9aa6; --frame: #0c0c0f; --btn: #2c2d34; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; background: var(--bg); color: var(--ink);
         font: 14px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
  header { display: flex; gap: 8px; align-items: center; padding: 14px; flex-wrap: wrap; justify-content: center; }
  select, button { background: var(--btn); color: var(--ink); border: 1px solid #3a3b44; border-radius: 8px;
                   padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: #5a5b66; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px 16px 30px; }
  .phone { position: relative; background: var(--frame); border-radius: 54px; padding: 14px;
           box-shadow: 0 0 0 2px #3b3c44, 0 30px 80px rgba(0,0,0,.55); transform-origin: top center; }
  .phone::before { content: ""; position: absolute; left: -4px; top: 150px; width: 4px; height: 60px;
                   background: #3b3c44; border-radius: 3px 0 0 3px; box-shadow: 0 80px 0 #3b3c44; }
  .phone::after { content: ""; position: absolute; right: -4px; top: 190px; width: 4px; height: 90px;
                  background: #3b3c44; border-radius: 0 3px 3px 0; }
  .screen { position: relative; overflow: hidden; border-radius: 40px; background: #fff; }
  .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 110px; height: 32px;
           background: #000; border-radius: 20px; z-index: 2; pointer-events: none; }
  .phone.landscape .notch { top: 50%; left: 10px; transform: translateY(-50%); width: 32px; height: 110px; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
  .hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <select id="device">
    <option value="390x844">iPhone 14 (390×844)</option>
    <option value="430x932">iPhone 14 Pro Max (430×932)</option>
    <option value="375x667">iPhone SE (375×667)</option>
    <option value="412x915">Pixel 7 (412×915)</option>
    <option value="360x800">Galaxy S20 (360×800)</option>
  </select>
  <button id="rotate">Pivoter</button>
  <button id="reload">Recharger l'app</button>
  <span class="hint">Molette pour défiler · clic = toucher</span>
</header>
<div class="stage">
  <div class="phone" id="phone">
    <div class="screen" id="screen">
      <div class="notch"></div>
      <iframe id="app" src="http://localhost:5600/" allow="camera; microphone; clipboard-read; clipboard-write"></iframe>
    </div>
  </div>
</div>
<script>
  const phone = document.getElementById('phone');
  const screen = document.getElementById('screen');
  const device = document.getElementById('device');
  const app = document.getElementById('app');
  let landscape = false;

  function layout() {
    let [w, h] = device.value.split('x').map(Number);
    if (landscape) [w, h] = [h, w];
    screen.style.width = w + 'px';
    screen.style.height = h + 'px';
    phone.classList.toggle('landscape', landscape);
    // Shrink the whole phone when the window is too small to show it at 1:1.
    const availH = window.innerHeight - 110, availW = window.innerWidth - 40;
    const scale = Math.min(1, availH / (h + 28), availW / (w + 28));
    phone.style.transform = `scale(${scale})`;
    phone.style.marginBottom = `${(h + 28) * (scale - 1)}px`;
  }

  device.onchange = layout;
  document.getElementById('rotate').onclick = () => { landscape = !landscape; layout(); };
  document.getElementById('reload').onclick = () => { app.src = app.src; };
  window.onresize = layout;
  layout();
</script>
</body>
</html>
