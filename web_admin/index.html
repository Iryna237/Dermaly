<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dermaly Admin — Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <main class="card p-4 p-md-5" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
      <div class="stat-icon mx-auto mb-3" style="background: var(--light-purple); color: var(--primary-purple);">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h1 class="h4 fw-bold mb-1">Dermaly Admin</h1>
      <p class="text-secondary small mb-0">Espace réservé aux administrateurs</p>
    </div>

    <div id="alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold">Email</label>
        <input type="email" class="form-control" id="email" autocomplete="username" required>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label small fw-semibold">Mot de passe</label>
        <input type="password" class="form-control" id="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2" id="submit-btn">
        <span class="spinner-border spinner-border-sm d-none me-2" id="spinner" aria-hidden="true"></span>
        <span id="submit-label">Se connecter</span>
      </button>
    </form>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
